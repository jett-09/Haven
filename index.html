      if (btn) { btn.textContent = '🎵 Start Music'; btn.classList.remove('playing'); }
    } else {
      music.volume = 0.4; music.play(); _musicPlaying = true;
      if (btn) { btn.textContent = '🎵 Pause Music'; btn.classList.add('playing'); }
    }
  }
</script>
</body>
</html>
