<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Puns 😭 Aathmika's Corner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lunari.css">
  <style>
    #chatMessages {
      display:flex; flex-direction:column; gap:10px;
      max-height:400px; overflow-y:auto;
      padding:4px 4px 12px; margin-bottom:16px;
      scrollbar-width:thin; scrollbar-color:rgba(176,160,255,0.3) transparent;
    }
    #chatMessages::-webkit-scrollbar{width:4px;}
    #chatMessages::-webkit-scrollbar-thumb{background:rgba(176,160,255,0.3);border-radius:4px;}
    .message {
      padding:12px 16px; border-radius:18px; max-width:80%;
      font-size:0.92rem; line-height:1.55; word-break:break-word;
      animation:msgPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes msgPop{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
    .message small{display:block;font-size:0.7rem;margin-top:5px;opacity:0.55;}
    .message.user{align-self:flex-end;background:linear-gradient(135deg,var(--magical-violet),var(--night-purple));color:white;border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(139,116,255,0.35);}
    .message.user small{text-align:right;}
    .message.jarvis{align-self:flex-start;background:linear-gradient(135deg,rgba(58,45,153,0.7),rgba(27,14,85,0.85));color:var(--lavender);border:1px solid rgba(176,160,255,0.22);border-bottom-left-radius:4px;}
    .inputArea{display:flex;gap:10px;align-items:center;}
    .inputArea input{flex:1;padding:12px 18px;border-radius:50px;border:1px solid rgba(176,160,255,0.3);background:rgba(27,14,85,0.55);backdrop-filter:blur(10px);color:var(--lavender);font-family:'Nunito',sans-serif;font-size:0.9rem;outline:none;transition:border 0.25s,box-shadow 0.25s;}
    .inputArea input:focus{border-color:var(--magical-violet);box-shadow:0 0 0 3px rgba(139,116,255,0.25);}
    .inputArea input::placeholder{color:rgba(176,160,255,0.45);}
    .inputArea button{padding:12px 22px;border:none;border-radius:50px;background:linear-gradient(135deg,var(--magical-violet),var(--dream-purple));color:white;font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(139,116,255,0.45);transition:all 0.25s;white-space:nowrap;}
    .inputArea button:hover{transform:scale(1.05);}
    .header-row{display:flex;align-items:center;gap:.8rem;margin-bottom:1.5rem;}
    .header-icon{font-size:2rem;}
  </style>
</head>
<body>
<div id="kitten-cursor"></div>
<a href="index.html" class="brand-tag">🐱 Aathmika's Corner ✨</a>
<div id="bg">
  <div class="moon"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="star-field" id="stars"></div>
</div>
<div id="app" style="justify-content:flex-start;padding-top:80px;">
  <div class="header-row">
    <span class="header-icon">😭</span>
    <div>
      <h1 class="page-title">Puns</h1>
      <p class="page-sub">Warning: may cause involuntary eye-rolls ✨</p>
    </div>
  </div>
  <div class="lunari-card" style="width:100%;">
    <div id="chatMessages"></div>
    <div class="inputArea">
      <input id="userInput" placeholder="Send me something, Karan" onkeydown="if(event.key==='Enter') sendPun()"/>
      <button onclick="sendPun()">Send 😭</button>
    </div>
  </div>
  <a href="index.html" class="back-link">← Back to Corner</a>
</div>
<script src="lunari.js"></script>
<script src="script.js"></script>
</body>
</html>
